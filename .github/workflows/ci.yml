name: CI

# Mirrors .gitlab-ci.yml (this project's primary CI target, given the
# HARMAN JD's GitLab CI/CD focus) so the repo has working CI on
# GitHub too, without needing gitlab-ci-local installed. The
# drift-matrix job here does the same real network clone of
# torvalds/linux at real tags that was verified locally with
# gitlab-ci-local -- see docs/validation-notes.md.

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet flake8
      - run: flake8 --max-line-length=100 warden/ tests/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pytest pyyaml
      - run: python3 -m pytest -v -m "not integration"

  drift-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: check the real patch stack against real upstream tags
        run: python3 -m warden.cli matrix --tags v5.15,v6.1,v6.6,v6.12,v6.17
        # Expected to report drift (exit 1) on this project's own
        # series as committed today -- patch 0002 genuinely needs a
        # rebase from v6.1 onward. That is Warden correctly doing its
        # job, not a broken pipeline, so this step is allowed to
        # "fail" without failing the whole workflow.
        continue-on-error: true
